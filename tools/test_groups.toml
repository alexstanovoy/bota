# The test groups of this repository, read by tools/test_groups.py (its header says how they are used).
#
# Every test (unit, integration, doc and ignored) is in exactly one group: a group selects tests by crate, build (profile and
# features), target and libtest name filters (substrings, as libtest matches them), or holds a directory's Python unittest
# tests (`unittest = DIR`: its test_*.py files, as `python3 -m unittest discover` finds them). Every file of the repository
# says which groups a change to it runs:
#   - a file a group's `paths` names runs that group, and a `[[route]]` names further groups for files several groups read;
#     a group's `also_paths` add it to the groups of files something else names (a "!pattern" there leaves files out);
#   - a file of a crate not marked `routed` runs every group of the crate and of every crate depending on it (Cargo's
#     dependencies, development ones too, and the crate's `dependents`); so does a file of a routed crate that a route sends
#     to "@<crate>";
#   - a file of a routed crate (bota_server) must be named by a group or a route: `check` fails on one that is not;
#   - a file outside the crates must be named too: "*" runs every group, an empty list none (documents in a crate too).
# Group names in a route may end in "*" (every group of that prefix). `check` fails on a pattern that names no file, a
# filter that selects no test, a test in no group or in two, a group with no test, more than 30 groups, a test target with
# a harness of its own and a bench no group's command runs.

[crate.bota_proto]
[crate.bota_core]
[crate.bota_replay]

[crate.bota_client_core]
# `web` is the browser's (wasm32 only; the gate's wasm steps check it).
features = ["ui", "websocket"]
wasm_only_features = ["web"]

[crate.bota_radovid]
features = ["e2e"]
wasm_only_features = ["web"]

[crate.bota_server]
routed = true
# bota_radovid's end-to-end tests launch the release bota_server.
dependents = ["bota_radovid"]

[crate.import_items]
manifest = "tools/import_items/Cargo.toml"
profile = "release"

# Files outside the crates.
[[route]]
paths = ["Cargo.toml", "Cargo.lock", "tools/*.sh", "tools/test_groups.py", "tools/test_groups.toml"]
groups = ["*"]

[[route]]
# Documents, the licence, the fuzz targets (the gate's fuzz-check builds them), the PGO script; deny.toml is the gate's
# deny step, which always runs.
paths = ["**.md", "LICENSE", ".gitignore", "deny.toml", "fuzz/**", "scripts/**"]
groups = []

# bota_proto, bota_core, bota_replay and bota_client_core: each crate is one group, and a change to any of them runs
# everything above it.
[[group]]
name = "proto"
about = "the wire: messages, codecs, the registry, fixed-point math; also as the product builds it (no overflow checks)"
tests = [{ crate = "bota_proto" }, { crate = "bota_proto", profile = "release" }]

[[group]]
name = "core"
about = "the rules and data every crate shares"
tests = [{ crate = "bota_core" }]

[[group]]
name = "replay"
about = "replay metadata"
tests = [{ crate = "bota_replay" }]

[[group]]
name = "client_core"
about = "what clients share: sessions, sockets, replay files, the UI model"
tests = [{ crate = "bota_client_core" }]

[[group]]
name = "radovid"
about = "a real radovid in-process, matching players and launching the release bota_server"
tests = [{ crate = "bota_radovid", env = { BOTA_SERVER_BIN = "{target_dir}/release/bota_server" }, before = [
    ["cargo", "build", "--release", "-p", "bota_server"],
] }]

[[group]]
name = "import_items"
about = "the item importer: its own checks, and that the committed item table is what a Dota 2 install gives"
# the files it reads: the item table it writes and checks, and the ids it registers items under
also_paths = ["crates/bota_core/src/data/items.rs", "crates/bota_core/src/roshan_data.rs", "crates/bota_core/src/placement_data.rs", "crates/bota_proto/registry/ids.txt"]
tests = [{ crate = "import_items", args = ["--include-ignored"] }]

[[group]]
name = "tooling"
about = "the gate's own machinery: test groups, routing, stamps and the gate and precheck flow (Python unittest)"
paths = ["tools/test_*.py"]
also_paths = ["crates/bota_core/build.rs", "crates/bota_core/rules_source.rs"]
tests = [{ unittest = "tools" }]

# bota_server: the simulation (game_*) and the server around it (server_*). A file of one game system runs its group and
# game_determinism (the pins and the bench digests, which catch any change of the simulation); what the whole world is
