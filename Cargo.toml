[workspace]
resolver = "3"
members = [
    "crates/bota_client_core",
    "crates/bota_core",
    "crates/bota_gym",
    "crates/bota_lua",
    "crates/bota_proto",
    "crates/bota_radovid",
    "crates/bota_replay",
    "crates/bota_server",
]
# bota_radovid, bota_gym and bota_lua are helpers and hosts for client and bot writers and stay out of a plain cargo build and
# test: they are built by `-p` and `--workspace`.
default-members = [
    "crates/bota_client_core",
    "crates/bota_core",
    "crates/bota_proto",
    "crates/bota_replay",
    "crates/bota_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["game", "simulation", "deterministic", "dota", "bot"]
categories = ["games", "simulation"]

[workspace.dependencies]
heatel = { version = "0.1.0", default-features = false }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit-mut", "clone-impls"] }
proc-macro2 = { version = "=1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
prettyplease = { version = "=0.2.37", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
rustix = { version = "=1.1.6", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
# The Lua interpreter, an independent project, from crates.io.
luagee = { version = "0.1.0", default-features = false }
bota_client_core = { path = "crates/bota_client_core" }
bota_core = { path = "crates/bota_core" }
bota_proto = { path = "crates/bota_proto" }
bota_radovid = { path = "crates/bota_radovid" }
bota_replay = { path = "crates/bota_replay" }
radovid_proto = { path = "../radovid/crates/radovid_proto", default-features = false }
bota_server = { path = "crates/bota_server", default-features = false }
criterion = { version = "=0.8.2", default-features = false }

[workspace.lints.clippy]
float_arithmetic = "deny"

# One codegen unit: the server's hot loops call small functions across the
# modules of one crate and across the rule crates, and a single unit lets the
# optimizer see them together (the tick loop runs ~6% faster than with 16).
[profile.release]
codegen-units = 1

# What the tests are built with: release's optimisation (a debug build is too slow to test with) and the checks a debug build
# has, overflow checks and debug assertions, in the crates of this repository. The dependencies stay as release builds them, so
# the two profiles share their artifacts. The product (`cargo build --release`, the benches) is plain release.
[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true
codegen-units = 16

[profile.test-release.package."*"]
debug-assertions = false
overflow-checks = false
codegen-units = 1
