[workspace]
resolver = "3"
members = [
    "crates/bota_client_core",
    "crates/bota_core",
    "crates/bota_proto",
    "crates/bota_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
readme = "README.md"
keywords = ["game", "simulation", "deterministic", "dota", "bot"]
categories = ["games", "simulation"]

[workspace.dependencies]
bota_client_core = { path = "crates/bota_client_core" }
bota_core = { path = "crates/bota_core" }
bota_proto = { path = "crates/bota_proto" }
bota_server = { path = "crates/bota_server" }
criterion = { version = "=0.8.2", default-features = false }

[workspace.lints.clippy]
float_arithmetic = "deny"

# One codegen unit: the server's hot loops call small functions across the
# modules of one crate and across the rule crates, and a single unit lets the
# optimizer see them together (the tick loop runs ~6% faster than with 16).
[profile.release]
codegen-units = 1
