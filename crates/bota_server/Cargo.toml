[package]
name = "bota_server"
version.workspace = true
edition.workspace = true

[features]
default = []
phase-profile = []

[dependencies]
bota_proto = { workspace = true }
rand_chacha = "0.10"
clap = { version = "4", features = ["derive"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
