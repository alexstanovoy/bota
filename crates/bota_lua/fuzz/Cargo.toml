# The fuzz target of the bot-script host, a workspace of its own like fuzz/ (the fuzzer's flags and libFuzzer stay out of
# the main build) and like bota_lua itself (it needs the luagee checkout). `fuzz.sh` is the one of fuzz/, linked here: it
# builds and runs the targets of the directory it is called from.
[package]
name = "bota_lua_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bota_lua = { path = ".." }
bota_client_core = { path = "../../bota_client_core" }
bota_core = { path = "../../bota_core" }
bota_proto = { path = "../../bota_proto" }
bota_server = { path = "../../bota_server" }
libfuzzer-sys = "0.4"

[workspace]
members = ["."]

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "lua_binding"
path = "fuzz_targets/lua_binding.rs"
test = false
doc = false
bench = false
