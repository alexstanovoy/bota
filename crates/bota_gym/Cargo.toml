[package]
name = "bota_gym"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Train and evaluate bots against bota in-process: vectorised deterministic matches on a worker pool, seeding, opponent scheduling, batch runners and match statistics."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["simulation"]
# Matches themselves: Game, MatchSpec, PlayerEnv. Without it the crate is the simulator-free
# plumbing: seeding, opponent pools, workers, drivers and pinning.
simulation = ["dep:bota_client_core", "dep:bota_core", "dep:bota_replay", "dep:bota_server"]

[dependencies]
bota_client_core = { workspace = true, optional = true }
bota_core = { workspace = true, optional = true }
bota_proto = { workspace = true }
bota_replay = { workspace = true, optional = true }
bota_server = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Pins worker threads to a cache domain without unsafe code.
rustix = { version = "1", default-features = false, features = ["thread"] }

[[example]]
name = "random_duel"
required-features = ["simulation"]

[[example]]
name = "privileged_read"
required-features = ["simulation"]

[[test]]
name = "e2e"
required-features = ["simulation"]

[lints]
workspace = true
