[package]
name = "bota_client_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everything a bota client needs that is not drawing: connection, session, orders."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bota_core = { workspace = true }
bota_proto = { workspace = true }
bota_replay = { workspace = true }
# Replays are Zstandard streams; a pure-Rust decoder reads them in the browser too.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "Performance", "WebSocket", "Window"] }

[features]
default = []
ui = []
# WebSocket (ws:// and wss://) for the socket transports.
websocket = ["dep:rustls", "dep:tungstenite", "dep:webpki-roots"]
# The browser's WebSocket as a `LiveLink`; wasm32 only.
web = ["ui", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[lints]
workspace = true
